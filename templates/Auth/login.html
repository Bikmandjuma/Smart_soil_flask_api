{% extends "Auth/cover.html" %}
{% block auth_block %}

<style type="text/css">
    body {
        overflow: auto;
    }
</style>

<link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

<div class="flex items-center min-h-screen p-6 bg-gray-50 dark:bg-gray-900">
    <div class="flex-1 h-full max-w-4xl mx-auto overflow-hidden bg-white rounded-lg shadow-xl dark:bg-gray-800">
        <div class="flex flex-col overflow-y-auto md:flex-row">
            <div class="h-32 md:h-auto md:w-1/2">
                <img aria-hidden="true" class="object-cover w-full h-full dark:hidden"
                    src="{{ url_for('static', filename='style/AuthPages/assets/img/login-office.jpeg') }}" alt="Office" />
                <img aria-hidden="true" class="hidden object-cover w-full h-full dark:block"
                    src="{{ url_for('static', filename='style/AuthPages/assets/img/login-office-dark.jpeg') }}" alt="Office" />
            </div>
            <div class="flex items-center justify-center p-6 sm:p-12 md:w-1/2">
                <div class="w-full">
                    <h1 class="mb-4 text-xl font-semibold text-gray-700 dark:text-gray-200">Login</h1>
                    <form id="loginForm">
                        <label class="block text-sm">
                            <span class="text-gray-700 dark:text-gray-400">Email</span>
                            <input id="email" name="email"
                                class="block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input"
                                placeholder="Enter email" required />
                        </label>
                        <label class="block mt-4 text-sm">
                            <span class="text-gray-700 dark:text-gray-400">Password</span>
                            <input id="password" name="password"
                                class="block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input"
                                placeholder="Enter password" type="password" required />
                        </label>
                        <button type="submit" id="loginButton"
                            class="block w-full px-4 py-2 mt-4 text-sm font-medium leading-5 text-center text-white transition-colors duration-150 bg-purple-600 border border-transparent rounded-lg active:bg-purple-600 hover:bg-purple-700 focus:outline-none focus:shadow-outline-purple">
                            Log in
                        </button>
                    </form>

                    <hr class="my-8" />
                    <div style="align-items: center; text-align: center;">
                        <div class="footer-social">
                            <a class="btn" href=""><i class="fab fa-twitter"></i></a>
                            <a class="btn" href=""><i class="fab fa-facebook-f"></i></a>
                            <a class="btn" href="#" id="google-login-btn"><i class="fab fa-google"></i></a>
                            <a class="btn" href=""><i class="fab fa-linkedin-in"></i></a>
                            <a class="btn" href=""><i class="fab fa-github"></i></a>
                        </div>
                        <p class="mt-4">
                            <a class="text-sm font-medium text-purple-600 dark:text-purple-400 hover:underline"
                                href="/forgot_password">
                                Forgot your password?
                            </a>
                        </p>
                        <p class="mt-1">
                            <a class="text-sm font-medium text-purple-600 dark:text-purple-400 hover:underline"
                                href="/register">
                                Don't have an account? Sign up
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const loginButton = e.target.querySelector('button[type="submit"]');
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        loginButton.disabled = true;
        loginButton.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Logging...';

        try {
            const response = await fetch('https://jobsphererdaapi-production.up.railway.app/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),  // Use email as 'username' for login
            });

            const result = await response.json();

            if (response.ok) {
                const token = result.authorization.token;
                localStorage.setItem('authToken', token);

                // Show loading spinner for 5 seconds before redirecting
                setTimeout(() => {
                    const userStatus = result.status;
                    if (userStatus.includes('Admin')) {
                        // Redirect Admin to their dashboard
                        localStorage.setItem('admin_data', JSON.stringify(result.admin_data));  // Store admin data
                        window.location.href = '/admin/dashboard';  // Admin's dashboard route
                    } else if (userStatus.includes('User')) {
                        // Redirect User to their dashboard
                        localStorage.setItem('user_data', JSON.stringify(result.user_data));  // Store user data
                        window.location.href = '/user/dashboard';  // User's dashboard route
                    } else {
                        toastr.error('Unknown user type. Please contact support.');
                        loginButton.disabled = false;
                        loginButton.innerHTML = 'Log in';
                    }
                }, 5000); // Delay of 5 seconds
            } else {
                // Show error if login fails
                toastr.error(result.wrong_Cred || 'Login failed. Please try again.');
                loginButton.disabled = false;
                loginButton.innerHTML = 'Log in';
            }
        } catch (error) {
            console.error('Error:', error);
            toastr.error('An error occurred. Please try again later.');
            loginButton.disabled = false;
            loginButton.innerHTML = 'Log in';
        }
    });

    // Attach click event listener to the button
        // document.getElementById('google-login-btn').addEventListener('click', function (event) {
        //     event.preventDefault();

        //     // Redirect to the Google authentication API
        //     const googleAuthUrl = 'http://127.0.0.1:8000/api/auth/google';
        //     window.location.href = googleAuthUrl;
        // });
    document.getElementById('google-login-btn').addEventListener('click', function (event) {
        event.preventDefault();
        
        // Redirect to the Google authentication API
        const googleAuthUrl = 'http://127.0.0.1:8000/api/auth/google';
        window.location.href = googleAuthUrl;
    });

    // Handle the callback and store token in localStorage (client-side)
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (token) {
            localStorage.setItem('jwt_token', token);  // Save the token to localStorage
        }
    });


    toastr.options = {
        "closeButton": true,
        "debug": false,
        "newestOnTop": true,
        "progressBar": true,
        "positionClass": "toast-top-right",
        "preventDuplicates": true,
        "showDuration": "300",
        "hideDuration": "1000",
        "timeOut": "5000",
        "extendedTimeOut": "1000",
        "showEasing": "swing",
        "hideEasing": "linear",
        "showMethod": "fadeIn",
        "hideMethod": "fadeOut"
    };
</script>
{% endblock %}
